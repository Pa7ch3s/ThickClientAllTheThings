{% extends "base.html" %}
{% block announce %}{% endblock %}

{% block extrahead %}
{% set og_title = page.title if page and page.title else config.site_name %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ config.site_name }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ config.site_description }}">
<meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
<meta property="og:image" content="{{ config.site_url }}assets/logo.png">
<meta property="og:image:width" content="805">
<meta property="og:image:height" content="891">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ config.site_description }}">
<meta name="twitter:image" content="{{ config.site_url }}assets/logo.png">
<link rel="apple-touch-icon" href="{{ config.site_url }}assets/logo.png">
{% endblock %}
