 <polygon points="120.0,4.0 137.6,77.5 202.0,38.0 162.5,102.4 236.0,120.0 162.5,137.6 202.0,202.0 137.6,162.5 120.0,236.0 102.4,162.5 38.0,202.0 77.5,137.6 4.0,120.0 77.5,102.4 38.0,38.0 102.4,77.5" fill="#08130c" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="miter"/>
