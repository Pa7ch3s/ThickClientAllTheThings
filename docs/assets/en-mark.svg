<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-label="Exploit Nation">
  <defs>
    <linearGradient id="en-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ffe9"/>
      <stop offset=".45" stop-color="#39ff5e"/>
      <stop offset="1" stop-color="#0aa63a"/>
    </linearGradient>
    <filter id="en-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- angular shuriken star silhouette -->
  <g filter="url(#en-glow)">
    <path fill="#08120b" stroke="url(#en-g)" stroke-width="3.5" stroke-linejoin="round"
      d="M60 4 L72 34 L104 26 L86 54 L116 60 L86 66 L104 94 L72 86 L60 116 L48 86 L16 94 L34 66 L4 60 L34 54 L16 26 L48 34 Z"/>

    <!-- circuit traces: E (left) -->
    <g fill="none" stroke="url(#en-g)" stroke-width="4.6" stroke-linecap="square" stroke-linejoin="round">
      <path d="M40 40 H58 M40 40 V80 M40 60 H54 M40 80 H58"/>
      <!-- N (right) -->
      <path d="M66 80 V40 L82 80 V40"/>
    </g>

    <!-- circuit nodes -->
    <g fill="#c8ffd6">
      <circle cx="60" cy="4" r="2.3"/><circle cx="116" cy="60" r="2.3"/>
      <circle cx="60" cy="116" r="2.3"/><circle cx="4" cy="60" r="2.3"/>
    </g>
  </g>

  <!-- glitch shards -->
  <g opacity=".85">
    <rect x="78" y="30" width="7" height="2.4" fill="#c8ffd6"/>
    <rect x="30" y="86" width="9" height="2.4" fill="#39ff5e"/>
    <rect x="88" y="70" width="3" height="6" fill="#39ff5e"/>
  </g>
</svg>
