site_name: Exploit Nation
site_description: The modern Hack The Planet reference. Book 01, ThickClientAllTheThings.
site_url: https://pa7ch3s.github.io/exploitnation/
repo_url: https://github.com/Pa7ch3s/exploitnation
repo_name: Pa7ch3s/exploitnation
copyright: Maintained by pa7ch3s. Authorized testing only.

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: black
    accent: green
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/exploit-nation.css
extra_javascript:
  - js/matrix.js
  - js/search-cap.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

plugins:
  - search

nav:
  - ThickClientAllTheThings: index.md
  - Reconnaissance & Unpacking: recon-and-unpacking.md
  - Secrets & Data at Rest: secrets-at-rest.md
  - Inter-Process Communication: ipc.md
  - Embedded Web Layer: embedded-web-layer.md
  - Update Mechanism: update-mechanism.md
  - Binary Protections & Tampering: binary-and-tampering.md
  - Network & API: network-and-api.md
  - Runtime, Memory & Instrumentation: runtime-and-memory.md
  - Auth, Licensing & Authorization: auth-licensing-authz.md
  - Deep Links & Protocol Handlers: deep-links-and-protocol-handlers.md
  - Checklist: CHECKLIST.md
